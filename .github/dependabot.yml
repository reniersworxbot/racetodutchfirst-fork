# Weekly update PRs for the Python dependencies (uv.lock) and the pinned Actions.
# Actions stay pinned to a commit SHA; Dependabot moves the SHA and its version comment.
# Security updates arrive as soon as an advisory lands, outside this schedule.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
  # The Dockerfile's base images (python, uv), pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns: ["*"]
